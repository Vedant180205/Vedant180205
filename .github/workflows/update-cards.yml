name: Update README cards

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_readme_cards.py
      - scripts/fetch_contributions.py
      - fonts/**

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Vedant180205
        run: python scripts/fetch_contributions.py

      - name: Render README cards
        run: python scripts/render_readme_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          git diff --cached --quiet || git commit -m "chore: refresh README cards [skip ci]"
          git push
